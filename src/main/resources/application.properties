spring.application.name=url-shortener
server.port=8080

dynamodb.region=us-east-1
# Leave empty to use real AWS; set to the DynamoDB Local endpoint for development
dynamodb.endpoint=http://localhost:8042
dynamodb.create-table=true

domain-shortener=https://domain-url-shortener

# Numbers each instance reserves from the shared counter at a time
shortener.block-size=1000
# Key of the permutation that scrambles counter numbers into codes. Same on every instance and
# NEVER change it once codes are issued. Development value only: override with SHORTENER_CODESECRET.
shortener.code-secret=dev-only-secret-change-me

# Only the health endpoint, used by the docker compose healthcheck (nginx does not expose it)
management.endpoints.web.exposure.include=health
