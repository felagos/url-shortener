services:
  url-shortener-dynamodb:
    image: amazon/dynamodb-local:latest
    container_name: url-shortener-dynamodb
    command: "-jar DynamoDBLocal.jar -sharedDb -dbPath /home/dynamodblocal/data"
    user: root
    ports:
      - "8042:8000"
    volumes:
      - dynamodb_data:/home/dynamodblocal/data
    restart: unless-stopped

  # Replicas have no published port: they are only reachable through nginx
  url-shortener-api:
    build: .
    expose:
      - "8080"
    environment:
      # Inside the compose network DynamoDB listens on its container port
      - DYNAMODB_ENDPOINT=http://url-shortener-dynamodb:8000
      - DYNAMODB_REGION=us-east-1
      - DYNAMODB_CREATETABLE=true
      - SHORTENER_CODESECRET=${SHORTENER_CODESECRET:-dev-only-secret-change-me}
    depends_on:
      - url-shortener-dynamodb
    deploy:
      replicas: ${API_REPLICAS:-3}
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  url-shortener-nginx:
    image: nginx:1.28.0-alpine
    container_name: url-shortener-nginx
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      url-shortener-api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  dynamodb_data:
    driver: local
