services:
  url-shortener-dynamodb:
    image: amazon/dynamodb-local:latest
    container_name: url-shortener-dynamodb
    command: "-jar DynamoDBLocal.jar -sharedDb -dbPath /home/dynamodblocal/data"
    user: root
    ports:
      - "8042:8000"
    volumes:
      - dynamodb_data:/home/dynamodblocal/data
    restart: unless-stopped

  url-shortener-api:
    build: .
    container_name: url-shortener-api
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      # Inside the compose network DynamoDB listens on its container port
      - DYNAMODB_ENDPOINT=http://url-shortener-dynamodb:8000
      - DYNAMODB_REGION=us-east-1
      - DYNAMODB_CREATETABLE=true
    depends_on:
      - url-shortener-dynamodb
    restart: unless-stopped

volumes:
  dynamodb_data:
    driver: local
