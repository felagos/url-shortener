worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Docker's embedded DNS: returns one IP per API replica and is re-queried every 10s,
    # so scaled, removed or restarted replicas are picked up without reloading nginx
    resolver 127.0.0.11 valid=10s ipv6=off;

    log_format upstream '$remote_addr "$request" $status -> $upstream_addr ($upstream_response_time s)';
    access_log /dev/stdout upstream;
    error_log /dev/stderr warn;

    upstream url_shortener_api {
        zone url_shortener_api 64k;
        server url-shortener-api:8080 resolve;
    }

    server {
        listen 80;

        location /shortener {
            proxy_pass http://url_shortener_api;

            # A stopped replica keeps its IP in nginx until the next DNS refresh, and connecting to
            # it hangs instead of being refused: fail fast (default is 60s) and try another replica.
            # nginx only retries a POST if nothing was sent yet, so a failed connect is safe to retry.
            proxy_connect_timeout 2s;
            proxy_next_upstream error timeout;
            proxy_next_upstream_tries 3;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Only the API is public; /actuator and anything else stay internal
        location / {
            return 404;
        }
    }
}
